# The test VMs' clean snapshots may have no Visual C++ runtime: without this the program imports
# VCRUNTIME140.dll and Windows refuses to start it (error 126 or a missing-DLL box) before main,
# so no crash would be recorded in the DLL it loads. With the C runtime linked in, it imports
# Windows' own DLLs only.
#
# This file applies only when cargo runs from this crate's folder (cargo reads .cargo\config.toml
# from the working directory upwards, not from --manifest-path). After a build,
# `dumpbin /dependents fake-cmd.exe` must list system DLLs only (KERNEL32.dll first) and no
# VCRUNTIME140.dll or api-ms-win-crt-*.dll.
[build]
rustflags = ["-C", "target-feature=+crt-static"]
