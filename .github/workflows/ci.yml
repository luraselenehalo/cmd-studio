# CI on a throwaway Windows runner: format, four clippy runs, the pinned runtimes,
# the normal tests, then the system tests that change this runner's real AutoRun and fonts.
# The `app` job checks the desktop app crate and its TypeScript bindings on a runner of its own.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A new push cancels the older run of the same branch or pull request, but never a run on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # bash, not the default PowerShell: bash stops at the first failing command (-e), while
      # PowerShell would report only the last command's exit code, so a failing
      # `rustup toolchain install` would pass when `cargo --version` still worked.
      - name: Install the toolchain pinned in rust-toolchain.toml
        shell: bash
        run: |
          rustup --version
          rustup toolchain install
          cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      # The fake adapters sit behind the core's `fake` feature, which only the CLI's
      # dev-dependency turns on. So the first run below lints the core WITH the fakes (a
      # workspace build unifies the feature), the second WITHOUT them, as a release build
      # sees the core, and the third names the feature itself, so it does not depend on
      # the CLI's dev-dependency. The fourth lints the core with its `ts` feature (the ts-rs
      # derives the app's TypeScript bindings come from) and without the fakes: the workspace
      # run has `ts` too, through the app crate, but only together with `fake`.
      - name: Clippy of the workspace (the core with the fake adapters, through the CLI's dev-dependency)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy of the core alone, as a release build sees it (no fake adapters)
        run: cargo clippy -p cmdstudio-core --all-targets -- -D warnings
      - name: Clippy of the core alone, with --features fake
        run: cargo clippy -p cmdstudio-core --all-targets --features fake -- -D warnings
      - name: Clippy of the core alone, with --features ts
        run: cargo clippy -p cmdstudio-core --all-targets --features ts -- -D warnings
      # The pins (URLs and SHA-256) live in scripts/fetch-resources.ps1, which also writes
      # resources/manifest.json. A new pin changes the script, so the key changes and the
      # next run downloads again.
      - name: Cache the pinned runtimes and font
        uses: actions/cache@v4
        with:
          path: resources
          key: resources-${{ runner.os }}-${{ hashFiles('scripts/fetch-resources.ps1') }}
      # Runs after a cache hit too, on purpose: the script compares every file in
      # resources/ with its pinned SHA-256 and prints "resources are complete: ..." when
      # all match, and it downloads again (also hash-checked) when one is missing or
      # different. A partial or tampered cache is therefore refused, never trusted.
      - name: Fetch the pinned runtimes and font
        shell: powershell
        run: ./scripts/fetch-resources.ps1
      # `cargo test --workspace` builds the core with the `fake` feature (see above). The
      # core's own unit tests have the fakes either way (they sit behind
      # cfg(any(test, feature = "fake"))), so the second step guards the rest: the core's
      # integration tests (crates/core/tests) and the library they link, built without the
      # feature. The no-fake clippy run above is the stronger check of the library itself.
      # Two steps, not two lines of one: PowerShell reports only the last command's exit
      # code, so a failure in the first would be lost.
      - name: Tests
        run: cargo test --workspace
      - name: Tests of the core alone (no fake adapters)
        run: cargo test -p cmdstudio-core
      - name: System tests (this runner's real AutoRun, fonts and bundled runtimes)
        shell: bash
        env:
          # Exactly '1': any other value skips the test and prints SKIPPED. The system
          # tests (crates/cli/tests/system.rs, system_real_autorun_round_trips,
          # system_real_font_install_and_remove), the symlink tests and the 8.3 name test read
          # the first; the Oh My Posh render test (crates/core/tests/omp_render.rs) has a gate
          # of its own.
          CMDSTUDIO_SYSTEM_TESTS: '1'
          CMDSTUDIO_OMP_TESTS: '1'
          # The log is an artifact for people to read, so no colour codes in it.
          CARGO_TERM_COLOR: never
        run: |
          # GitHub starts `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`: with
          # pipefail a failing `cargo test` fails this step even though `tee` succeeds.
          # --test-threads=1 keeps the tests that touch this runner's AutoRun and fonts from
          # overlapping; --nocapture shows the SKIPPED lines tests print; 2>&1 puts stderr in
          # the log too.
          cargo test --workspace -- --test-threads=1 --nocapture 2>&1 | tee system-tests.txt
          # CI is where the gated tests prove themselves: a SKIPPED line anywhere means one
          # did not run. grep -n prints each line it finds; -a treats the log as text even if
          # a test printed a stray control or non-UTF-8 byte (grep would answer "Binary file
          # matches" and print no line).
          if grep -a -n SKIPPED system-tests.txt; then
            echo "::error::a test printed SKIPPED in the system-test run (lines above); every test must run here"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-tests-log
          path: system-tests.txt
          if-no-files-found: ignore
  # The app (Phase 2b): the app crate, its tests over the in-memory machine, and the bindings'
  # freshness. Separate from the Rust job so a UI failure and a Rust failure read apart. (The
  # `windows` job's workspace runs cover the app crate too: its clippy and its tests.)
  app:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        shell: bash
        run: |
          rustup --version
          rustup toolchain install
          cargo --version
      - name: Cache the pinned runtimes and font
        uses: actions/cache@v4
        with:
          path: resources
          key: resources-${{ runner.os }}-${{ hashFiles('scripts/fetch-resources.ps1') }}
      - name: Fetch the pinned runtimes and font
        shell: powershell
        run: ./scripts/fetch-resources.ps1
      # The committed bindings must be what the Rust types export now (G11). The script runs the
      # core's and the app's export tests into app/ui/src/bindings, after removing the .ts files
      # there; then any line of `git status --porcelain` is a difference: a changed file, a
      # deleted one (a type that is gone), or a new one never committed, which `git diff` alone
      # would not show.
      - name: Bindings are fresh
        shell: bash
        run: |
          pwsh -NoProfile -File ./scripts/export-bindings.ps1
          stale="$(git status --porcelain -- app/ui/src/bindings)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::app/ui/src/bindings is stale: run scripts/export-bindings.ps1 and commit"
            exit 1
          fi
      - name: Clippy of the app crate
        run: cargo clippy -p cmdstudio-app --all-targets -- -D warnings
      - name: Tests of the app crate (backend over the in-memory machine)
        run: cargo test -p cmdstudio-app
      # A compile check only: this exe is never shipped and never run, here or in a VM. No cargo
      # build enables `tauri/custom-protocol`, so to Tauri it is a "dev build"; with no `devUrl`
      # in tauri.conf.json (pinned by config_guard.rs) it embeds the UI rather than loading a dev
      # server, but it is still not the app. The real exe is made by `npx tauri build` (the 2c
      # plan's Task 7).
      - name: Release build of the exe (a compile check, not run)
        run: cargo build -p cmdstudio-app --release
