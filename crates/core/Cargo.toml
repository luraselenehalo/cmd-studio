[package]
name = "cmdstudio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
# Built into CMD Studio only. presets.rs embeds files from outside this crate's folder
# (`/presets`), which a published crate could not hold.
publish = false

[lints]
workspace = true

[features]
# In-memory adapters for tests in other crates (crates/cli). Never enabled in a release build.
fake = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
schemars = { version = "1", features = ["uuid1"] }

# The registry adapter (`adapters::windows::registry`); `adapters::windows` is cfg(windows) too.
[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
# host.rs: Foundation, Globalization, Security(+Authorization), Storage_FileSystem,
# Storage_Packaging_Appx, System_Com, System_SystemInformation, System_SystemServices,
# System_Threading, UI_Shell. fonts.rs: Foundation, Graphics_Gdi, System_Threading (its leak
# test's GetGuiResources), UI_WindowsAndMessaging.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest = "1"
mlua = { version = "0.10", features = ["lua52", "vendored"] }
tempfile = "3"
